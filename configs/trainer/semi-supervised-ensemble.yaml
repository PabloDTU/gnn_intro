defaults:
  - _self_

method: semi-supervised-ensemble

train:
  total_epochs: 400
  validation_interval: 10

init:
  _target_: trainer.SemiSupervisedEnsemble
  supervised_criterion:
    _target_: torch.nn.MSELoss
    reduction: mean

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 7e-4
    weight_decay: 0.0001

  scheduler:
    _target_: schedulers.build_onecycle
    _partial_: true
    max_lr: 8e-4
    total_steps: ${trainer.train.total_epochs}
    pct_start: 0.1
    div_factor: 10
    final_div_factor: 1000
  scheduler_step_on: epoch

  # Existing regularization
  edge_drop_prob: 0.05 # VAT already injects perturbations
  feature_mask_prob: 0.05
  grad_clip_norm: 5.0

  # VAT knobs
  use_vat: true
  unsup_weight: 1.5
  unsup_rampup_epochs: 80
  vat_eps: 0.025
  vat_xi: 0.0005
  vat_iters: 1