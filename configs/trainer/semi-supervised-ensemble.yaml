defaults:
  - _self_

method: semi-supervised-ensemble

train:
  total_epochs: 400
  validation_interval: 10

init:
  optimizer:
    lr: 5e-4
    weight_decay: 1e-6

  scheduler:
    max_lr: 5e-4
    total_steps: 400

  edge_drop_prob: 0.05
  feature_mask_prob: 0.05
  grad_clip_norm: 1.0

  use_vat: true
  unsup_weight: 2.0
  unsup_rampup_epochs: 30
  vat_eps: 0.05
  vat_xi: 0.0005
  vat_iters: 2