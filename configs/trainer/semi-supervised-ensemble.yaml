defaults:
  - _self_

method: semi-supervised-ensemble

train:
  total_epochs: 20
  validation_interval: 10
  save_best_path: "checkpoints/best_model.pt"

init:
  _target_: trainer.SemiSupervisedEnsemble
  supervised_criterion:
    _target_: torch.nn.MSELoss
    reduction: mean

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1e-3
    weight_decay: 1e-4

  scheduler:
    _target_: schedulers.build_onecycle
    _partial_: true
    max_lr: 1e-3
    total_steps: ${trainer.train.total_epochs}
    pct_start: 0.3
    div_factor: 25
    final_div_factor: 1e4
  scheduler_step_on: epoch

  # Existing regularization
  edge_drop_prob: 0.05
  feature_mask_prob: 0.05
  grad_clip_norm: 5.0

  # VAT knobs
  use_vat: true
  unsup_weight: 8.0
  unsup_rampup_epochs: 50
  vat_eps: 0.09
  vat_xi: 0.001
  vat_iters: 2