defaults:
  - _self_

method: semi-supervised-ensemble

train:
  total_epochs: 400
  validation_interval: 10

init:
  _target_: trainer.SemiSupervisedEnsemble
  supervised_criterion:
    _target_: torch.nn.MSELoss
    reduction: mean

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 7e-4
    weight_decay: 1e-4

  scheduler:
    _target_: schedulers.build_warmup_cosine
    _partial_: true
    warmup_epochs: 10
    total_epochs: ${trainer.train.total_epochs}
    warmup_start_factor: 0.1
    eta_min: 1e-6
  scheduler_step_on: epoch

  # Existing regularization
  edge_drop_prob: 0.05
  feature_mask_prob: 0.05
  grad_clip_norm: 5.0

  # VAT knobs
  use_vat: true
  unsup_weight: 30
  unsup_rampup_epochs: 1
  vat_eps: 0.05
  vat_xi: 0.001
  vat_iters: 2

  # Cross Pseudo Supervision (N-CPS)
  use_ncps: false
  ncps_weight: 0.1

  # Mean-teacher
  use_mean_teacher: false
  mean_teacher_weight: 0.1
  mean_teacher_ema_decay: 0.99